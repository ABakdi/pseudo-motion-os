[workspace]
resolver = "2"
members = [
    "crates/pmos-abi",
    "crates/pmos-conjure",
    "crates/pmos-kernel",
    "crates/pmos-platform",
    "crates/pmos-apps",
    "crates/pmos-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ABakdi/pseudo-motion-os"

[workspace.dependencies]
# internal crates
pmos-abi = { path = "crates/pmos-abi" }
pmos-conjure = { path = "crates/pmos-conjure" }
pmos-kernel = { path = "crates/pmos-kernel" }
pmos-platform = { path = "crates/pmos-platform" }
pmos-apps = { path = "crates/pmos-apps" }

# shared external deps (versions pinned in one place)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"

# graphics / ui (egui-wgpu re-exports wgpu — use `egui_wgpu::wgpu` so there is
# exactly one wgpu version in the graph)
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = { version = "0.35", default-features = false, features = ["links"] }
winit = "0.30"
glam = "0.30"

# wasm interop
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"   # small wasm binaries; hot paths live on the GPU anyway
lto = true

[package]
name = "pmos-platform"
description = "Platform bridge: ALL web-sys/js-sys/Tauri interop lives here and nowhere else"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator"] }

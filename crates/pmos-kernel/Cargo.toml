[package]
name = "pmos-kernel"
description = "The pseudo kernel: graphics, physics, ray tracer, input, AI, VFS, processes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pmos-abi = { workspace = true }
pmos-conjure = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
glam = { workspace = true }
rapier3d = { workspace = true }

[dev-dependencies]
# Shader CI: parse + validate every .wgsl at test time (they otherwise only
# fail at runtime, on the GPU, in the browser). Version pinned to wgpu's.
naga = { version = "29.0.4", features = ["wgsl-in"] }
